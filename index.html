<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crazy Science · हाथ से विज्ञान</title>
<meta name="description" content="Camera ke saamne haath hilao aur science samjho: atom, solar system, chaand ki kalayein, trigonometry, molecule, dil ki dhadkan, body X-ray aur bhi. Hindi aur English me, free, browser me.">
<meta property="og:title" content="Crazy Science · हाथ से विज्ञान 🖐️">
<meta property="og:description" content="Haath se atom todo, grahon ko ghumao, ungliyon se trigonometry seekho. Free, Hindi aur English me, seedha browser me.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03060d;
    --panel: #070c17;
    --line: rgba(70, 220, 255, .22);
    --cyan: #46dcff;
    --cyan-rgb: 70, 220, 255;
    --text: #e8f6ff;
    --dim: rgba(232, 246, 255, .64);
    --mono: 'Share Tech Mono', ui-monospace, monospace;
    --cut: 14px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Rajdhani', system-ui, sans-serif; font-size: 18px; line-height: 1.5; overflow-x: hidden; cursor: crosshair; }
  a, button { cursor: pointer; }
  a { color: inherit; }
  ::selection { background: var(--cyan); color: #001018; }

  /* ---------- background layers ---------- */
  #net { position: fixed; inset: 0; z-index: -3; }
  .floor { position: fixed; left: -50%; right: -50%; bottom: -10vh; height: 55vh; z-index: -2; pointer-events: none;
    background-image: linear-gradient(rgba(var(--cyan-rgb), .22) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--cyan-rgb), .22) 1px, transparent 1px);
    background-size: 60px 60px; transform: perspective(420px) rotateX(62deg); transform-origin: top center;
    mask-image: linear-gradient(to top, #000 10%, transparent 85%); -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 85%);
    animation: floor 3s linear infinite; }
  .scan { position: fixed; inset: 0; z-index: 50; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  .vignette { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, transparent 50%, rgba(0,0,0,.7) 100%); }
  .corner { position: fixed; width: 34px; height: 34px; border: 0 solid rgba(var(--cyan-rgb), .7); z-index: 40; pointer-events: none; }
  .corner.tl { top: 64px; left: 10px; border-width: 2px 0 0 2px; } .corner.tr { top: 64px; right: 10px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; } .corner.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

  /* ---------- top HUD bar ---------- */
  .hud { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: rgba(3, 6, 13, .78); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 14px; letter-spacing: .08em; }
  .hud .brand { font-family: 'Orbitron', 'Rajdhani', sans-serif; font-weight: 900; letter-spacing: .14em; color: var(--cyan); white-space: nowrap; }
  .hud .brand span { color: var(--dim); font-family: var(--mono); font-weight: 400; letter-spacing: .06em; }
  .hud .sys { color: var(--dim); display: flex; gap: 16px; white-space: nowrap; overflow: hidden; }
  .hud .sys b { color: #3dff8b; font-weight: 400; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3dff8b; box-shadow: 0 0 10px #3dff8b; margin-right: 6px; animation: blink 1.6s infinite; }
  .hbtn { font: 700 13px var(--mono); letter-spacing: .1em; color: var(--cyan); background: transparent; border: 1px solid var(--line); padding: 7px 12px; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .hbtn:hover { background: rgba(var(--cyan-rgb), .14); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; align-items: center; padding: 64px 0 36px; }
  .boot-tag { font-family: var(--mono); color: var(--cyan); font-size: 15px; letter-spacing: .14em; margin-bottom: 10px; }
  .boot-tag::before { content: '> '; color: #3dff8b; }
  .glitch { position: relative; font-family: 'Orbitron', 'Rajdhani', sans-serif; font-weight: 900; font-size: clamp(38px, 7.4vw, 82px); line-height: 1; letter-spacing: .04em; margin: 0;
    color: #fff; text-shadow: 0 0 18px rgba(var(--cyan-rgb), .8), 0 0 42px rgba(180, 107, 255, .45); }
  .glitch::before, .glitch::after { content: attr(data-text); position: absolute; inset: 0; overflow: hidden; }
  .glitch::before { color: #ff2fd0; transform: translate(-2px, 0); clip-path: inset(0 0 60% 0); animation: gl1 3.2s infinite steps(1); opacity: .8; }
  .glitch::after { color: #46dcff; transform: translate(2px, 0); clip-path: inset(55% 0 0 0); animation: gl2 2.7s infinite steps(1); opacity: .8; }
  .tagline { font-size: clamp(22px, 3.6vw, 32px); font-weight: 700; margin: 14px 0 8px; min-height: 1.4em; }
  .tagline .caret { display: inline-block; width: .55em; height: 1em; background: var(--cyan); vertical-align: -.12em; margin-left: 4px; animation: blink .9s steps(1) infinite; }
  .lead { color: var(--dim); max-width: 600px; font-size: 19px; margin: 0 0 24px; }
  .cta { display: inline-flex; align-items: center; gap: 12px; padding: 15px 28px; font: 800 15px 'Orbitron', 'Rajdhani', sans-serif; letter-spacing: .14em; text-decoration: none; color: #001018;
    background: linear-gradient(90deg, #46dcff, #8f7bff); clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); position: relative; overflow: hidden; }
  .cta::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); transform: skewX(-20deg); animation: shine 2.8s infinite; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; font-family: var(--mono); font-size: 13px; letter-spacing: .06em; color: var(--dim); }
  .chips span { border: 1px solid var(--line); padding: 5px 10px; background: rgba(var(--cyan-rgb), .05); }

  /* radar hologram */
  .radar { position: relative; width: min(360px, 80vw); aspect-ratio: 1; margin: 0 auto; }
  .radar .r { position: absolute; border-radius: 50%; border: 1px solid rgba(var(--cyan-rgb), .45); }
  .radar .r1 { inset: 0; border-style: dashed; animation: spin 26s linear infinite; }
  .radar .r2 { inset: 9%; border: 2px solid transparent; border-top-color: var(--cyan); border-left-color: rgba(var(--cyan-rgb), .5); animation: spin 6s linear infinite; }
  .radar .r3 { inset: 20%; border-style: dotted; border-width: 2px; animation: spin 14s linear infinite reverse; }
  .radar .r4 { inset: 31%; border-color: rgba(255, 47, 208, .55); animation: spin 9s linear infinite; border-right-color: transparent; border-bottom-color: transparent; border-width: 2px; }
  .radar .sweep { position: absolute; inset: 4%; border-radius: 50%; background: conic-gradient(from 0deg, rgba(var(--cyan-rgb), .45), transparent 22%); animation: spin 3.2s linear infinite; mask-image: radial-gradient(circle, transparent 28%, #000 30%); -webkit-mask-image: radial-gradient(circle, transparent 28%, #000 30%); }
  .radar .core { position: absolute; inset: 36%; border-radius: 50%; display: grid; place-items: center; font-size: clamp(48px, 9vw, 84px); background: radial-gradient(circle, rgba(var(--cyan-rgb), .28), transparent 70%); filter: drop-shadow(0 0 22px var(--cyan)); animation: pulse 2.4s ease-in-out infinite; }
  .radar .blip { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #ff2fd0; box-shadow: 0 0 14px #ff2fd0; animation: blink 1.4s infinite; }
  .radar .lab { position: absolute; font: 12px var(--mono); color: var(--cyan); letter-spacing: .1em; }

  /* ---------- sections ---------- */
  section { padding: 48px 0 0; }
  .sec-h { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; font-family: 'Orbitron', 'Rajdhani', sans-serif; font-size: clamp(18px, 3vw, 26px); letter-spacing: .14em; }
  .sec-h::before { content: ''; width: 10px; height: 10px; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); transform: rotate(45deg); }
  .sec-h::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .sec-h small { font-family: var(--mono); font-size: 13px; color: var(--dim); letter-spacing: .1em; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .filters button { font: 700 14px var(--mono); letter-spacing: .1em; color: var(--text); background: rgba(var(--cyan-rgb), .04); border: 1px solid var(--line); padding: 8px 14px; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .filters button.on { background: var(--cyan); color: #001018; border-color: var(--cyan); }

  /* lab modules */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 18px; }
  .card { --c: #46dcff; position: relative; display: block; padding: 1px; text-decoration: none; clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    background: linear-gradient(160deg, var(--c), rgba(255,255,255,.08) 35%, rgba(255,255,255,.05) 65%, var(--c)); transition: transform .2s, filter .2s; }
  .card:hover, .card:focus-visible { transform: translateY(-4px); filter: drop-shadow(0 0 18px color-mix(in srgb, var(--c) 55%, transparent)); outline: none; }
  .card .in { position: relative; height: 100%; display: flex; flex-direction: column; background: linear-gradient(180deg, #0a1120, var(--panel)); clip-path: inherit; overflow: hidden; }
  .card .in::before { content: ''; position: absolute; left: 0; right: 0; top: -40%; height: 40%; background: linear-gradient(transparent, color-mix(in srgb, var(--c) 22%, transparent), transparent); pointer-events: none; opacity: 0; }
  .card:hover .in::before { opacity: 1; animation: scan 1.3s linear infinite; }
  .card .bar { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; font: 13px var(--mono); letter-spacing: .12em; color: var(--c); border-bottom: 1px solid rgba(255,255,255,.07); background: color-mix(in srgb, var(--c) 7%, transparent); }
  .card .bar .st { color: #3dff8b; }
  .card .art { height: 140px; display: grid; place-items: center; font-size: 70px; position: relative;
    background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--c) 32%, transparent), transparent 62%); }
  .card .art::before { content: ''; position: absolute; width: 112px; height: 112px; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--c) 70%, transparent); animation: spin 14s linear infinite; }
  .card .art::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(color-mix(in srgb, var(--c) 12%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--c) 12%, transparent) 1px, transparent 1px); background-size: 22px 22px; mask-image: radial-gradient(circle, #000 20%, transparent 70%); -webkit-mask-image: radial-gradient(circle, #000 20%, transparent 70%); }
  .card .emo { position: relative; z-index: 1; filter: drop-shadow(0 0 16px var(--c)); animation: bob 4s ease-in-out infinite; }
  .card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card h3 { margin: 0; font-size: 26px; line-height: 1.15; color: #fff; }
  .card h3 small { display: block; font: 14px var(--mono); color: var(--c); letter-spacing: .12em; margin-top: 3px; }
  .card p { margin: 6px 0 8px; color: var(--dim); font-size: 17px; }
  .card .meta { display: flex; justify-content: space-between; align-items: center; font: 13px var(--mono); color: var(--dim); letter-spacing: .06em; }
  .card .gest { font-size: 19px; letter-spacing: .12em; }
  .card .launch { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); font: 700 13px 'Orbitron', 'Rajdhani', sans-serif; letter-spacing: .16em; color: var(--c); background: color-mix(in srgb, var(--c) 8%, transparent); }
  .card:hover .launch { background: var(--c); color: #001018; }
  .card .meter { height: 3px; background: rgba(255,255,255,.08); margin-top: 6px; }
  .card .meter i { display: block; height: 100%; width: var(--lvl); background: var(--c); box-shadow: 0 0 8px var(--c); }

  /* briefing, protocols, security */
  .term { border: 1px solid var(--line); background: rgba(3, 10, 18, .8); padding: 18px 20px; font-family: var(--mono); font-size: 16px; line-height: 1.9; clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
  .term .p { color: #3dff8b; }
  .term .c { color: var(--dim); }
  .term b { color: #fff; font-weight: 400; }
  .protocols { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .pr { border: 1px solid var(--line); padding: 14px 12px; text-align: center; background: rgba(var(--cyan-rgb), .03); position: relative; }
  .pr::before { content: attr(data-code); position: absolute; top: 6px; left: 8px; font: 11px var(--mono); color: var(--cyan); letter-spacing: .1em; }
  .pr .e { font-size: 36px; margin-top: 6px; filter: drop-shadow(0 0 10px rgba(var(--cyan-rgb), .6)); }
  .pr b { display: block; font-size: 19px; }
  .pr span { color: var(--dim); font-size: 15px; }
  .security { border: 1px solid rgba(61, 255, 139, .4); background: rgba(61, 255, 139, .05); padding: 16px 18px; color: var(--dim); font-size: 17px; }
  .security b { color: #3dff8b; font-family: var(--mono); letter-spacing: .1em; font-weight: 400; }
  footer { padding: 54px 0 46px; text-align: center; font-family: var(--mono); color: var(--dim); font-size: 14px; letter-spacing: .1em; }
  footer b { color: var(--cyan); font-weight: 400; }

  /* ---------- boot screen + launch transition ---------- */
  #boot, #warp { position: fixed; inset: 0; z-index: 100; background: radial-gradient(ellipse at center, #071426, #000 75%); display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 16px; transition: opacity .5s; }
  #boot.gone, #warp.gone { opacity: 0; pointer-events: none; }
  .power { width: 140px; height: 140px; border-radius: 50%; border: 2px solid var(--cyan); background: rgba(var(--cyan-rgb), .08); color: var(--cyan); font-size: 56px; display: grid; place-items: center; box-shadow: 0 0 30px rgba(var(--cyan-rgb), .5), inset 0 0 30px rgba(var(--cyan-rgb), .25); position: relative; }
  .power::after { content: ''; position: absolute; inset: -14px; border-radius: 50%; border: 1px solid rgba(var(--cyan-rgb), .5); animation: ping 1.8s infinite; }
  .boot-title { font-family: 'Orbitron', 'Rajdhani', sans-serif; font-weight: 900; letter-spacing: .2em; color: var(--cyan); margin-top: 26px; font-size: clamp(18px, 4vw, 28px); text-align: center; }
  .boot-hint { font-family: var(--mono); color: var(--dim); margin-top: 8px; letter-spacing: .12em; font-size: 14px; }
  #log { width: min(640px, 100%); font-family: var(--mono); font-size: clamp(13px, 2.4vw, 16px); line-height: 1.85; color: #bfefff; margin-top: 20px; min-height: 9em; white-space: pre-wrap; }
  #log .ok { color: #3dff8b; } #log .warn { color: #ffd27a; }
  .prog { width: min(640px, 100%); height: 6px; border: 1px solid var(--line); margin-top: 12px; }
  .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #46dcff, #b46bff); box-shadow: 0 0 12px var(--cyan); transition: width .2s; }
  .skip { position: absolute; bottom: 22px; right: 22px; }
  #warp .t { font-family: 'Orbitron', 'Rajdhani', sans-serif; font-weight: 900; letter-spacing: .18em; color: var(--cyan); font-size: clamp(16px, 3.6vw, 26px); text-align: center; }
  #warp .s { font-family: var(--mono); color: #3dff8b; margin-top: 10px; letter-spacing: .14em; }

  @keyframes floor { to { background-position: 0 60px, 0 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes bob { 50% { transform: translateY(-7px) rotate(-3deg); } }
  @keyframes scan { to { top: 100%; } }
  @keyframes shine { 60%, 100% { left: 130%; } }
  @keyframes ping { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
  @keyframes gl1 { 0%, 92%, 100% { transform: translate(0); opacity: 0; } 93% { transform: translate(-4px, -1px); opacity: .9; } 96% { transform: translate(3px, 1px); opacity: .9; } }
  @keyframes gl2 { 0%, 88%, 100% { transform: translate(0); opacity: 0; } 89% { transform: translate(4px, 1px); opacity: .9; } 93% { transform: translate(-3px, 0); opacity: .9; } }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding-top: 36px; text-align: center; } .lead { margin-inline: auto; } .chips { justify-content: center; } .radar { width: min(260px, 70vw); grid-row: 1; } .hud .sys .hide-sm { display: none; } }
  @media (max-width: 520px) { body { font-size: 17px; } .hud .brand span, .hud .sys { display: none; } .hbtn { padding: 6px 9px; } .corner { display: none; } .card .art { height: 118px; font-size: 60px; } }
  .hbtn { white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }
  .hud .right { display: flex; gap: 8px; }
  .langs { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .langs .power { width: 150px; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 700 17px 'Orbitron', 'Rajdhani', sans-serif; letter-spacing: .1em; }
  .langs .power .ico { font-size: 46px; line-height: 1; }
  @media (max-width: 520px) { .langs .power { width: 124px; height: 124px; } }
</style>
</head>
<body>
<canvas id="net" aria-hidden="true"></canvas>
<div class="floor" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<div class="hud">
  <div class="brand">◢ CRAZY SCIENCE <span>// OS v1.0</span></div>
  <div class="sys"><span><i class="dot"></i><b data-i="online"></b></span><span class="hide-sm" data-i="labsCount"></span><span id="clock">--:--:--</span></div>
  <div class="right"><button class="hbtn" id="langBtn" title="Language / भाषा"></button><button class="hbtn" id="snd" aria-pressed="true"></button></div>
</div>

<main class="wrap">
  <header class="hero">
    <div>
      <div class="boot-tag" data-i="bootTag"></div>
      <h1 class="glitch" data-text="CRAZY SCIENCE">CRAZY SCIENCE</h1>
      <div class="tagline"><span id="type"></span><span class="caret"></span></div>
      <p class="lead" data-i="lead"></p>
      <a class="cta" href="#labs" data-sfx="servo" data-i="cta"></a>
      <div class="chips" id="chips"></div>
    </div>
    <div class="radar" aria-hidden="true">
      <div class="r r1"></div><div class="r r2"></div><div class="r r3"></div><div class="r r4"></div>
      <div class="sweep"></div>
      <div class="core">🖐️</div>
      <i class="blip" style="top:16%;left:62%"></i><i class="blip" style="top:70%;left:18%;animation-delay:.6s"></i><i class="blip" style="top:58%;left:84%;animation-delay:1.1s"></i>
      <span class="lab" style="top:2%;left:58%">⚛ LAB-01</span><span class="lab" style="top:86%;left:6%">🪐 LAB-02</span><span class="lab" style="top:48%;right:-6%">🧪 LAB-05</span>
    </div>
  </header>

  <section id="labs">
    <h2 class="sec-h"><span data-i="labsH"></span> <small data-i="labsSub"></small></h2>
    <div class="filters" role="group" aria-label="Subject filter">
      <button class="on" data-f="all" data-i="fAll"></button>
      <button data-f="physics" data-i="fPhy"></button>
      <button data-f="chemistry" data-i="fChem"></button>
      <button data-f="bio" data-i="fBio"></button>
      <button data-f="maths" data-i="fMath"></button>
      <button data-f="fun" data-i="fFun"></button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section>
    <h2 class="sec-h"><span data-i="briefH"></span> <small data-i="briefSub"></small></h2>
    <div class="term" id="brief"></div>
  </section>

  <section>
    <h2 class="sec-h"><span data-i="protoH"></span></h2>
    <div class="protocols" id="protos"></div>
  </section>

  <section>
    <h2 class="sec-h"><span data-i="secH"></span></h2>
    <div class="security" data-html="secBody"></div>
  </section>
</main>

<footer class="wrap">
  <div data-html="foot1"></div>
  <div style="margin-top:6px" data-i="foot2"></div>
</footer>

<div id="boot" role="dialog" aria-label="Crazy Science boot">
  <div class="langs" id="langs">
    <button class="power" data-lang="hi"><span class="ico">⏻</span>हिंदी</button>
    <button class="power" data-lang="en"><span class="ico">⏻</span>ENGLISH</button>

const SFX = {
  ctx: null,
  on: (() => { try { return localStorage.getItem('cs.sound') !== 'off'; } catch { return true; } })(),
  ac() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
  tone(f0, f1, dur, type = 'square', vol = 0.05, at = 0) {
    if (!this.on) return;

    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, f0, f1, vol = 0.08, at = 0, q = 2) {
    if (!this.on) return;
    const c = this.ac(), t = c.currentTime + at;
    if (!this.buf) { this.buf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = this.buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    n.buffer = this.buf; f.type = 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f).connect(g).connect(c.destination); n.start(t); n.stop(t + dur);
  },
  click() { this.noise(0.03, 4000, 2500, 0.12); this.tone(1200, 1900, 0.05, 'square', 0.035); this.tone(1900, 900, 0.06, 'square', 0.03, 0.05); },
  hover() { this.tone(2200, 2600, 0.035, 'sine', 0.018); },
  servo() { this.tone(180, 520, 0.16, 'sawtooth', 0.03); this.noise(0.16, 600, 2400, 0.05, 0, 6); },
  type() { this.noise(0.012, 5000, 4000, 0.05); },
  ok() { this.tone(880, 880, 0.06, 'square', 0.03); this.tone(1320, 1320, 0.08, 'square', 0.03, 0.07); },

const boot = document.getElementById('boot'), log = document.getElementById('log'), prog = document.getElementById('prog');

let booting = false, bootDone = false;
async function runBoot() {
  if (booting) return;
  booting = true;
  document.getElementById('bootHint').textContent = L().bootHint;
  document.getElementById('langs').style.display = 'none';
  SFX.boot();
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const lines = L().boot;
  for (let i = 0; i < lines.length && !bootDone; i++) {
    const [text, status] = lines[i], row = document.createElement('div'), chars = Array.from(text);
    log.append(row);
    for (let j = 0; j <= chars.length && !bootDone; j++) { row.textContent = '> ' + chars.slice(0, j).join(''); if (j % 2) SFX.type(); await wait(14); }
    const dots = document.createElement('span'); dots.textContent = ' ' + '.'.repeat(Math.max(3, 40 - chars.length)) + ' ';
    const st = document.createElement('span'); st.className = 'ok'; st.textContent = status;
    row.append(dots, st); SFX.ok();
    prog.style.width = `${((i + 1) / lines.length) * 100}%`;
    await wait(140);
  }
  if (!bootDone) {
    const g = document.createElement('div'); g.className = 'warn'; g.textContent = L().granted; log.append(g);
    speakWelcome();
    await wait(700);
  }
  finishBoot();
}
function speakWelcome() {
  if (!SFX.on || !('speechSynthesis' in window)) return;
  const t = L(), u = new SpeechSynthesisUtterance(t.welcome);
  const v = speechSynthesis.getVoices().find((x) => x.lang.toLowerCase().startsWith(t.voiceLang));
  if (v) u.voice = v;
  u.lang = t.voiceLang === 'hi' ? 'hi-IN' : 'en-US'; u.pitch = 0.6; u.rate = 0.95;
  speechSynthesis.speak(u);
}
function finishBoot() {
  if (bootDone) return;
  bootDone = true;
  try { sessionStorage.setItem('cs.booted', '1'); } catch {}
  SFX.launch();
  boot.classList.add('gone');
  setTimeout(() => boot.remove(), 600);
}
if (seen) { boot.remove(); bootDone = true; }
else {
  document.querySelectorAll('#langs .power').forEach((b) => b.addEventListener('click', () => { setLang(b.dataset.lang); runBoot(); }));
  document.getElementById('skip').addEventListener('click', () => { SFX.click(); finishBoot(); });
  addEventListener('keydown', (e) => { if (bootDone) return; if (e.key === 'Escape') finishBoot(); else if (!booting && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); runBoot(); } });
}

// ---------------------------------------------------------------- typed tagline (restarts when the language changes)
const typeEl = document.getElementById('type');
let typeGen = 0;
async function restartTyping() {
  const gen = ++typeGen, wait = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let k = 0; gen === typeGen; k++) {
    const tags = L().tags, t = Array.from(tags[k % tags.length]);
    for (let i = 1; i <= t.length && gen === typeGen; i++) { typeEl.textContent = t.slice(0, i).join(''); await wait(55); }
    await wait(2200);
    for (let i = t.length; i >= 0 && gen === typeGen; i--) { typeEl.textContent = t.slice(0, i).join(''); await wait(22); }
    await wait(300);
  }
}

// ---------------------------------------------------------------- clock
const clockEl = document.getElementById('clock');
setInterval(() => { clockEl.textContent = 'SYS ' + new Date().toLocaleTimeString('en-GB'); }, 1000);

// ---------------------------------------------------------------- filters
let filter = 'all';
const btns = document.querySelectorAll('.filters button');
function applyFilter() {
  btns.forEach((x) => x.classList.toggle('on', x.dataset.f === filter));
  document.querySelectorAll('.card').forEach((c) => { c.style.display = filter === 'all' || c.dataset.cat === filter ? '' : 'none'; });
}
btns.forEach((b) => b.addEventListener('click', () => { filter = b.dataset.f; applyFilter(); }));

// ---------------------------------------------------------------- launching a lab: sound + "ACCESSING" screen, then go
const warp = document.getElementById('warp');
function bindCards() {
  document.querySelectorAll('.card').forEach((card) => card.addEventListener('click', (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return; // new-tab clicks behave normally
    e.preventDefault();
    SFX.launch();
    document.getElementById('warpT').textContent = L().warpT(card.dataset.code, card.dataset.name);
    document.getElementById('warpS').textContent = L().warpS;
    warp.classList.remove('gone');
    const p = document.getElementById('warpP');
    p.style.transition = 'none'; p.style.width = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => { p.style.transition = 'width .55s ease-in'; p.style.width = '100%'; }));
    setTimeout(() => { location.href = card.getAttribute('href'); }, 650);
  }));
}
// coming back with the browser's back button: hide the transition screen again
addEventListener('pageshow', () => { warp.classList.add('gone'); });

// ---------------------------------------------------------------- background: drifting network (reacts to the mouse)
const cv = document.getElementById('net'), g = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, nodes, mouse = { x: -999, y: -999 };
function resize() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  nodes = Array.from({ length: Math.min(90, Math.round(W * H / 15000)) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35 }));
}
function frame() {
  g.clearRect(0, 0, W, H);
  for (const n of nodes) {
    if (!still) { n.x += n.vx; n.y += n.vy; if (n.x < 0 || n.x > W) n.vx *= -1; if (n.y < 0 || n.y > H) n.vy *= -1; }
    const dm = Math.hypot(n.x - mouse.x, n.y - mouse.y);
    if (dm < 140 && !still) { n.x += (n.x - mouse.x) / dm * 0.8; n.y += (n.y - mouse.y) / dm * 0.8; }
  }
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 130) { g.strokeStyle = `rgba(70,220,255,${(1 - d / 130) * 0.28})`; g.lineWidth = 1; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
  }
  for (const n of nodes) { g.fillStyle = 'rgba(120,230,255,.75)'; g.fillRect(n.x - 1, n.y - 1, 2, 2); }
  if (!still) requestAnimationFrame(frame);
}
addEventListener('pointermove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('resize', () => { resize(); if (still) frame(); });
resize(); frame();

applyLang();
</script>
